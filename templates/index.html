<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SquiShop - лучший магазин сквишей</title>
    <style>
        body { font-family: Arial; background: #e0f0f0; margin: 0; padding: 20px; }
        .header { text-align: center; background: #a0d0d0; padding: 20px; border-radius: 10px; }
        .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .product-card { background: white; padding: 15px; border-radius: 10px; text-align: center; }
        .price { color: green; font-size: 18px; font-weight: bold; }
        .btn { background: #90d0a0; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>SquiShop</h1>
        <p>лучший магазин сквишей</p>
    </div>
    
    <div class="products">
        {% for product in products %}
        <div class="product-card">
            <h3>{{ product.name }}</h3>
            <p>{{ product.description }}</p>
            <p class="price">{{ product.price }} ₽</p>
            <p>Категория: {{ product.category }}</p>
            <a href="/product/{{ product.id }}">
                <button class="btn">Подробнее</button>
            </a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
